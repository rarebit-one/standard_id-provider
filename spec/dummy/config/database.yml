# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
# `migrations_paths` is set EXPLICITLY and must stay that way.
#
# Without it, Rails falls back to `ActiveRecord::Migrator.migrations_paths`,
# whose default is the *relative* string "db/migrate". RSpec runs from the gem
# root, so that resolved to the ENGINE's `db/migrate` — while `bin/rails
# app:db:migrate` used the dummy app's absolute path. The two disagreed, so
# `maintain_test_schema!` in `spec/rails_helper.rb` always reported the
# engine's own migrations as pending and aborted the suite before a single
# example ran. That mismatch — not the `StandardConfig` rename the CI comment
# blamed — is why the test matrix was disabled.
#
# The list below is the union both sides need: the dummy app's own migrations
# (which vendor `standard_id`'s via `bin/rails app:standard_id:install:migrations`)
# plus this engine's, which are never copied in because they load from the
# engine root.
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000
  migrations_paths:
    - <%= File.expand_path("../db/migrate", __dir__) %>
    - <%= File.expand_path("../../../db/migrate", __dir__) %>

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3

# SQLite3 write its data on the local filesystem, as such it requires
# persistent disks. If you are deploying to a managed service, you should
# make sure it provides disk persistence, as many don't.
#
# Similarly, if you deploy your application as a Docker container, you must
# ensure the database is located in a persisted volume.
production:
  <<: *default
  # database: path/to/persistent/storage/production.sqlite3
