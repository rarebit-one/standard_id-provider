# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

inherit_mode:
  merge:
    - Exclude

AllCops:
  Exclude:
    # Generated by `bin/rails app:db:migrate` and vendored verbatim from the
    # standard_id engine by `bin/rails app:standard_id:install:migrations`.
    # These are upstream artifacts; restyling them would only create diff noise
    # the next time they are refreshed.
    - spec/dummy/db/schema.rb
    - spec/dummy/db/migrate/*.standard_id.rb

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false
