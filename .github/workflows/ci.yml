name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: rarebit-one/.github/.github/workflows/reusable-gem-ci.yml@v2
    with:
      ruby-versions: '["4.0.0","4.0.1","4.0.2","4.0.3","4.0.4"]'
      lint-ruby-version: "4.0.4"
      lint-command: 'bundle exec rubocop --config .rubocop.yml -f github'
      # spec/dummy/storage/ is gitignored, so a fresh checkout has no test
      # database. db:test:prepare creates it from the committed
      # spec/dummy/db/schema.rb.
      pre-test-commands: |
        bin/rails app:db:test:prepare
      extra-lint-commands: |
        bundle exec brakeman --no-pager --force
        bundle exec bundler-audit --update

  # Resolve and test against the LATEST PUBLISHED standard_id, ignoring any
  # lockfile. This engine reaches into standard_id internals — it `prepend`s
  # into four non-public StandardId::Oauth classes — so the gemspec constraint
  # is a claim that needs verifying, and this job is what verifies it.
  #
  # It exists because the previous approach (a narrow `~> 0.29.0` gemspec cap on
  # the sibling plugins) failed silently: standard_id reached 0.32 with no
  # compatibility check and no plugin release, while the published gem kept an
  # older loose requirement, so consumers ran the untested combination
  # regardless. A CI failure here reaches the maintainer before a release; a
  # resolution failure reaches consumers after one.
  compat:
    name: Compat with latest standard_id
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "4.0.4"
          bundler-cache: false

      - name: Resolve against latest published standard_id
        run: |
          set -euo pipefail
          rm -f Gemfile.lock
          bundle install --jobs 4
          # Both parses are anchored so they cannot match this gem's own name
          # (standard_id-provider) — "standard_id" must be followed by " (".
          latest="$(gem list -r --exact standard_id \
                    | sed -n 's/^standard_id (\([^,)]*\).*/\1/p')"
          resolved="$(bundle list | sed -n 's/^ *\* standard_id (\(.*\))$/\1/p')"
          if [ -z "${latest}" ] || [ -z "${resolved}" ]; then
            echo "::error::could not determine standard_id versions (latest='${latest}' resolved='${resolved}')"
            exit 1
          fi
          echo "latest published: ${latest}"
          echo "resolved here:    ${resolved}"
          if [ "${latest}" != "${resolved}" ]; then
            echo "::error::gemspec constraint excludes the latest published standard_id (${latest}); it resolved ${resolved}. Widen spec.add_dependency \"standard_id\" or this gem cannot be published without capping its consumers."
            exit 1
          fi

      - name: Test against it
        env:
          RAILS_ENV: test
        run: |
          bin/rails app:db:test:prepare
          bundle exec rspec
